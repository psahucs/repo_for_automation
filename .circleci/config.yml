version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Build
          command: |
            mkdir -p artifacts
            echo "Build completed at $(date)" > artifacts/build-report.txt
      - store_artifacts:
          path: artifacts/build-report.txt
          destination: build-report

  test:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Test
          command: |
            mkdir -p test-results
            echo "All tests passed at $(date)" > test-results/test-report.txt
      - store_artifacts:
          path: test-results/test-report.txt
          destination: test-report
      - store_test_results:
          path: test-results

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Deploy
          command: |
            mkdir -p deploy-logs
            echo "Deployed successfully at $(date)" > deploy-logs/deploy-report.txt
      - store_artifacts:
          path: deploy-logs/deploy-report.txt
          destination: deploy-report

workflows:
  build-and-test:
    jobs:
      - build:
          filters:
            branches:
              only: main
      - test:
          requires:
            - build
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main
